name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        pytest: ["7.0.1", "7.4.4", "8.0.2", "8.4.2", "9.1.1"]
        exclude:
          # pytest 9 requires Python 3.10.
          - python: "3.9"
            pytest: "9.1.1"
          # pytest 7.0 cannot import itself on Python 3.14.
          - python: "3.14"
            pytest: "7.0.1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: >
          uv run --isolated --no-dev
          --python ${{ matrix.python }}
          --with "pytest==${{ matrix.pytest }}"
          pytest -q

  test-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv run --isolated --no-dev --python 3.14 --with pytest pytest -q
